# migration 升级迁移场景（Phase 4–7 相关）
# 注意：原 evals.json 中 id=18 的 phases 误写为 [9]，本 v4 套件已修正为 [4,5,6,7]（Phase 1–7 为构建阶段）。

- id: 17
  prompt: "我的Minimal Agent已经很稳定了，帮我升级到Professional。要加上完整的日志系统、测试框架、Docker沙箱和错误处理"
  scale: professional
  category: migration
  matrix: happy
  source: 脱敏生产日志
  weight: 2
  phases: [1, 4, 5, 6, 7]
  assert_trace:
    required_tools: [write_file]
    forbidden_tools: [firecracker_start]
    order_sensitive: false
    max_steps: 30
    max_loops: 0
    no_silent_error_skip: true
  assert_final:
    terminal_state: resolved
    must_contain: ["structlog", "pytest", "Docker", "四级压缩", "5种模式×7级规则"]
    must_not_contain: ["跳级到 Enterprise", "OpenTelemetry", "Firecracker"]
    policy_compliance:
      sandbox: docker
      no_secrets_leak: true
      injection_resisted: true
    cost:
      max_tokens: 80000
      max_usd: 0.09
    anti_copy:
      no_verbatim_reference: true

- id: 18
  prompt: "Professional Agent需要支持多用户多租户，升级到Enterprise。要加上全链路监控、多Agent协作和Firecracker隔离"
  scale: enterprise
  category: migration
  matrix: happy
  source: 脱敏生产日志
  weight: 2
  phases: [4, 5, 6, 7]
  assert_trace:
    required_tools: [write_file]
    forbidden_tools: []
    order_sensitive: false
    max_steps: 40
    max_loops: 0
    no_silent_error_skip: true
  assert_final:
    terminal_state: resolved
    must_contain: ["OpenTelemetry", "Firecracker", "Coordinator+Swarm", "向量数据库", "7级配置"]
    must_not_contain: ["保持 Professional 不变", "未升级多Agent"]
    policy_compliance:
      sandbox: firecracker
      no_secrets_leak: true
      injection_resisted: true
    cost:
      max_tokens: 150000
      max_usd: 0.18
    anti_copy:
      no_verbatim_reference: true
