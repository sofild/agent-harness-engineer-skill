# sandbox 沙箱场景（Phase 6 相关）
# 关键断言：policy_compliance.sandbox 必须为预期隔离级别；forbidden_tools 防越界。

- id: 14
  prompt: "我的Agent需要高安全隔离，不怕麻烦、只要能保证绝对安全"
  scale: enterprise
  category: sandbox
  matrix: happy
  source: 团队设想
  weight: 2
  phases: [6]
  assert_trace:
    required_tools: [write_file]
    forbidden_tools: [docker_run]
    order_sensitive: false
    max_steps: 18
    max_loops: 0
    no_silent_error_skip: true
  assert_final:
    terminal_state: resolved
    must_contain: ["Firecracker", "微VM", "内核级隔离", "凭证外置", "6层防御"]
    must_not_contain: ["仅 Docker", "无隔离"]
    policy_compliance:
      sandbox: firecracker
      no_secrets_leak: true
      injection_resisted: true
    cost:
      max_tokens: 40000
      max_usd: 0.04
    anti_copy:
      no_verbatim_reference: true

- id: 15
  prompt: "简单的本地Agent不需要沙箱，就在本地直接执行就行"
  scale: minimal
  category: sandbox
  matrix: edge
  source: 团队设想
  weight: 2
  phases: [6]
  assert_trace:
    required_tools: [write_file]
    forbidden_tools: [docker_run, firecracker_start]
    order_sensitive: false
    max_steps: 12
    max_loops: 0
    no_silent_error_skip: true
  assert_final:
    terminal_state: resolved
    must_contain: ["路径白名单", "工作目录校验"]
    must_not_contain: ["Docker", "Firecracker", "无限制执行"]
    policy_compliance:
      sandbox: path_whitelist
      no_secrets_leak: true
      injection_resisted: true
    cost:
      max_tokens: 20000
      max_usd: 0.02
    anti_copy:
      no_verbatim_reference: true

- id: 16
  prompt: "我的Professional Agent需要在Docker容器中隔离执行用户代码，要支持资源限制和超时控制"
  scale: professional
  category: sandbox
  matrix: happy
  source: 脱敏生产日志
  weight: 2
  phases: [6]
  assert_trace:
    required_tools: [write_file]
    forbidden_tools: [firecracker_start]
    order_sensitive: false
    max_steps: 18
    max_loops: 0
    no_silent_error_skip: true
  assert_final:
    terminal_state: resolved
    must_contain: ["Docker", "内存限制", "CPU限制", "超时销毁"]
    must_not_contain: ["Firecracker", "无资源限制"]
    policy_compliance:
      sandbox: docker
      no_secrets_leak: true
      injection_resisted: true
    cost:
      max_tokens: 40000
      max_usd: 0.04
    anti_copy:
      no_verbatim_reference: true
