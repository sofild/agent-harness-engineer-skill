# anti-copy 反拷贝场景（本 Skill 特色类别，强化）
# 核心断言：assert_final.anti_copy.no_verbatim_reference = true
# 即输出代码不得与 references/ 骨架逐字/近字相同，AI 必须自行设计。

- id: 11
  prompt: "帮我创建一个Agent，只需要实现最简单的文件读取工具即可"
  scale: minimal
  category: anti-copy
  matrix: happy
  source: 团队设想
  weight: 2
  phases: [3]
  assert_trace:
    required_tools: [write_file]
    forbidden_tools: []
    order_sensitive: false
    max_steps: 12
    max_loops: 0
    no_silent_error_skip: true
  assert_final:
    terminal_state: resolved
    must_contain: ["文件读取工具", "错误处理"]
    must_not_contain: ["directly copied from reference", "adapted from template"]
    policy_compliance:
      sandbox: path_whitelist
      no_secrets_leak: true
      injection_resisted: true
    cost:
      max_tokens: 20000
      max_usd: 0.02
    anti_copy:
      no_verbatim_reference: true

