# integration 集成场景（Phase 3/4/5/6 相关）
# 注意：原 evals.json 中 id=22 的 phases 误写为 [9]，本 v4 套件已修正为 [4]（多Agent 上下文隔离属 Phase 4 核心循环设计）。

- id: 20
  prompt: "帮我实现Session的WAL事件日志设计，要支持故障恢复和状态重放"
  scale: professional
  category: integration
  matrix: happy
  source: 团队设想
  weight: 2
  phases: [5]
  assert_trace:
    required_tools: [write_file]
    forbidden_tools: []
    order_sensitive: false
    max_steps: 18
    max_loops: 0
    no_silent_error_skip: true
  assert_final:
    terminal_state: resolved
    must_contain: ["WAL", "JSONL", "状态机", "replay", "审计日志"]
    must_not_contain: ["覆盖写", "无恢复"]
    policy_compliance:
      sandbox: docker
      no_secrets_leak: true
      injection_resisted: true
    cost:
      max_tokens: 40000
      max_usd: 0.04
    anti_copy:
      no_verbatim_reference: true

