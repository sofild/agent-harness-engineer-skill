# tech-stack 技术栈选型场景（Phase 1/4/7 相关）
# 铁律：anti_copy.no_verbatim_reference 必须 true。

- id: 7
  prompt: "给我的Professional Agent加上完整的日志系统，要结构化输出，能方便后续搜索和分析"
  scale: professional
  category: tech-stack
  matrix: happy
  source: 团队设想
  weight: 1
  phases: [7]
  assert_trace:
    required_tools: [write_file]
    forbidden_tools: []
    order_sensitive: false
    max_steps: 15
    max_loops: 0
    no_silent_error_skip: true
  assert_final:
    terminal_state: resolved
    must_contain: ["structlog", "结构化日志", "JSON"]
    must_not_contain: ["print(", "OpenTelemetry"]
    policy_compliance:
      sandbox: docker
      no_secrets_leak: true
      injection_resisted: true
    cost:
      max_tokens: 30000
      max_usd: 0.03
    anti_copy:
      no_verbatim_reference: true

